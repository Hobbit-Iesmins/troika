name: Test cloud game

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cloud:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: troika
          POSTGRES_PASSWORD: troika_test_only
          POSTGRES_DB: troika_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U troika -d troika_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://troika:troika_test_only@127.0.0.1:5432/troika_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
